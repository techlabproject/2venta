# La cola local (ElasticMQ). En AWS la define Terraform con los mismos nombres.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  2venta-trabajos {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "2venta-trabajos-fallidos"
      maxReceiveCount = 5
    }
  }
  2venta-trabajos-fallidos {}
}
